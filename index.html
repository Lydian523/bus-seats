<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2E6B4E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>山友團座位表 v5.5</title>
<style>
  :root{
    --green:#2E6B4E; --green-dk:#24523C; --green-lt:#DFF0E2;
    --ink:#26323F; --muted:#7A8683; --bg:#F3F4F1; --card:#FFFFFF;
    --line:#C7CEC9; --leave:#E3E5E2; --amber:#F2B705; --red:#C0392B;
    --seat-h:46px; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);font-size:17px;
    display:flex;flex-direction:column;min-height:100vh;
  }
  button{font-family:inherit}

  /* ── 頂部 ── */
  header{
    background:var(--green);color:#fff;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  }
  .trip-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .trip-btn{background:none;border:none;color:#fff;text-align:left;min-width:0}
  .trip-name{font-size:20px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trip-name::after{content:" ▾";font-size:14px;opacity:.8}
  .trip-sub{font-size:13px;opacity:.85;margin-top:2px;display:flex;gap:8px;align-items:center}
  .syncdot{display:inline-flex;align-items:center;gap:4px}
  .syncdot i{width:8px;height:8px;border-radius:50%;background:#B9C4BE;display:inline-block}
  .syncdot.ok i{background:#8FE3AE}
  .syncdot.busy i{background:var(--amber)}
  .syncdot.err i{background:#F1948A}
  .btn-share{
    flex:none;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);
    color:#fff;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:600;
  }

  nav{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
  nav button{
    flex:1;padding:14px 4px;font-size:18px;font-weight:700;color:var(--muted);
    background:none;border:none;border-bottom:4px solid transparent;
  }
  nav button.on{color:var(--green);border-bottom-color:var(--green)}

  .statusbar{
    padding:10px 16px;font-size:16px;background:#FBFCFA;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:48px;
    transition:background-color .2s,border-color .2s;
  }
  .statusbar.rc-warn{background:#FFF0F0;border-bottom:2px solid #D98A82}
  .statusbar.rc-ok{background:#EFF9F1;border-bottom:2px solid #8BCB98}
  .statusbar .big{font-size:20px;font-weight:800}
  .statusbar .warn{color:var(--red)}
  .statusbar .ok{color:var(--green)}
  .chip{
    display:inline-block;background:#fff;border:1.5px solid var(--line);
    border-radius:999px;padding:5px 12px;font-size:15px;font-weight:600;
  }
  button.chip{font-family:inherit;color:inherit;cursor:pointer}
  .chip.call{border-color:#9DB3A6;color:var(--green-dk)}
  .chip.miss{border-color:var(--red);color:var(--red)}
  .chip.ro{background:#FFF3E8;border-color:#E5B98F;color:#9A5B1F}

  .pending{
    background:#FFF7DF;border-bottom:2px solid var(--amber);
    padding:10px 16px;font-size:16px;font-weight:700;display:none;
    align-items:center;justify-content:space-between;gap:8px;
  }
  .pending.show{display:flex}
  .pending button{background:none;border:1.5px solid var(--ink);border-radius:8px;padding:6px 12px;font-size:15px;font-weight:600;color:var(--ink)}

  main{flex:1;display:flex;gap:14px;padding:14px;max-width:1080px;margin:0 auto;width:100%}
  .chart-wrap{flex:1;min-width:0}

  .bus{
    background:var(--card);border:2.5px solid var(--ink);border-radius:26px 26px 16px 16px;
    padding:10px 12px 14px;max-width:430px;margin:0 auto;
    position:relative;transition:border-color .2s, box-shadow .2s, background-color .2s;
  }
  .bus.rc-missing{
    border:5px solid var(--red);
    box-shadow:0 0 0 5px rgba(192,57,43,.14), 0 0 18px rgba(192,57,43,.22);
    animation:rcPulseRed 1.25s ease-in-out infinite;
  }
  .bus.rc-complete{
    border:5px solid var(--green);
    box-shadow:0 0 0 5px rgba(46,107,78,.14), 0 0 18px rgba(46,107,78,.22);
    background:#FBFFFC;
  }
  .bus.rc-missing .bus-head{color:var(--red);border-bottom-color:#E4B0AA}
  .bus.rc-complete .bus-head{color:var(--green);border-bottom-color:#A8D8B4}
  @keyframes rcPulseRed{
    0%,100%{box-shadow:0 0 0 5px rgba(192,57,43,.12), 0 0 16px rgba(192,57,43,.20)}
    50%{box-shadow:0 0 0 8px rgba(192,57,43,.22), 0 0 26px rgba(192,57,43,.36)}
  }
  .bus-head{
    text-align:center;font-size:14px;color:var(--muted);font-weight:700;
    border-bottom:2px dashed var(--line);padding:4px 0 8px;margin-bottom:10px;
    letter-spacing:.35em;
  }
  .cabin{display:flex;align-items:stretch}
  .col{display:flex;flex-direction:column;gap:6px;flex:1}
  .aisle{width:34px;flex:none}
  .seatrow{display:flex;gap:6px}
  .space{
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:12px;letter-spacing:.2em;min-height:26px;
  }
  .space.grow{flex:1}
  .space span{border:1.5px dashed var(--line);border-radius:8px;padding:2px 10px}

  .seat{
    flex:1;height:var(--seat-h);border-radius:9px;position:relative;
    border:1.5px dashed var(--line);background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:700;color:var(--ink);
    user-select:none;-webkit-user-select:none;
  }
  .seat .no{position:absolute;top:2px;left:5px;font-size:10px;font-weight:600;color:#ADB6B1}
  .seat.occ{border-style:solid;border-color:#9DB3A6;background:#F4F8F5}
  .seat.leave{background:var(--leave);border:1.5px solid #C9CEC9;color:#98A09B}
  .seat.leave .tag{position:absolute;bottom:2px;right:5px;font-size:10px;font-weight:700;color:#98A09B}
  .seat.boarded{background:var(--green-lt);border:2px solid var(--green);color:var(--green-dk)}
  .seat.boarded::after{content:"✓";position:absolute;top:1px;right:5px;font-size:13px;font-weight:900;color:var(--green)}
  .seat.sel{outline:3px solid var(--amber);outline-offset:1px}
  .seat:active{transform:scale(.96)}

  aside{width:280px;flex:none;display:none;flex-direction:column;gap:10px}
  .panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px}
  .panel h3{font-size:15px;color:var(--muted);font-weight:700;margin-bottom:8px}
  .plist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto}
  .pbtn{
    text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:17px;font-weight:700;color:var(--ink);
  }
  .pbtn small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
  .pbtn.sel{border-color:var(--amber);background:#FFF7DF}
  .pbtn.leave{background:#F1F2F0;border-color:#C9CEC9;color:#98A09B;box-shadow:none}
  .pbtn.leave .state{color:var(--red);font-weight:800}
  .barbtn{
    background:#fff;border:1.5px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:15px;font-weight:700;color:var(--ink);
  }
  .barbtn.danger{border-color:#E4C4BF;color:var(--red)}
  .barbtn.primary{border-color:var(--green);color:var(--green)}

  /* ── 旅客群組色：最多 10 組，排座位時用來辨識夫妻／同行小隊 ── */
  .g1{--g:#D96B6B;--gbg:#FFF1F1}
  .g2{--g:#D98B3A;--gbg:#FFF4E8}
  .g3{--g:#C6A022;--gbg:#FFF8D9}
  .g4{--g:#5FA864;--gbg:#ECF8ED}
  .g5{--g:#2F9A8E;--gbg:#E9F7F5}
  .g6{--g:#4C8EDB;--gbg:#EEF6FF}
  .g7{--g:#6D79D8;--gbg:#F0F1FF}
  .g8{--g:#9A6AD8;--gbg:#F6F0FF}
  .g9{--g:#C767A8;--gbg:#FFF0F8}
  .g10{--g:#8A7B68;--gbg:#F3F0EB}
  .seat.g1,.seat.g2,.seat.g3,.seat.g4,.seat.g5,.seat.g6,.seat.g7,.seat.g8,.seat.g9,.seat.g10,
  .pbtn.g1,.pbtn.g2,.pbtn.g3,.pbtn.g4,.pbtn.g5,.pbtn.g6,.pbtn.g7,.pbtn.g8,.pbtn.g9,.pbtn.g10{
    border-color:var(--g);background:var(--gbg);
    box-shadow:inset 0 -5px 0 var(--g);
  }
  .seat.boarded.g1,.seat.boarded.g2,.seat.boarded.g3,.seat.boarded.g4,.seat.boarded.g5,.seat.boarded.g6,.seat.boarded.g7,.seat.boarded.g8,.seat.boarded.g9,.seat.boarded.g10{
    background:var(--green-lt);box-shadow:inset 0 -5px 0 var(--g);
  }
  .seat.leave.g1,.seat.leave.g2,.seat.leave.g3,.seat.leave.g4,.seat.leave.g5,.seat.leave.g6,.seat.leave.g7,.seat.leave.g8,.seat.leave.g9,.seat.leave.g10{
    background:var(--leave);box-shadow:inset 0 -5px 0 var(--g);
  }
  .grp{
    position:absolute;bottom:2px;left:5px;font-size:10px;font-weight:900;
    color:#fff;background:var(--g,var(--muted));border-radius:999px;min-width:16px;height:16px;
    display:inline-flex;align-items:center;justify-content:center;padding:0 4px;
  }
  .note-badge{
    position:absolute;top:2px;right:5px;font-size:10px;font-weight:900;
    color:#7A4B00;background:#FFE39B;border:1px solid #D6A437;border-radius:999px;
    min-width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;
  }
  .seat.boarded .note-badge{right:20px}
  .seat.leave .note-badge{color:#8A6A20;background:#F1E0A8;border-color:#C6A45A}
  .pbtn .grp{position:static;margin-right:6px;vertical-align:middle}
  .group-label{
    display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;
    color:#fff;background:var(--g,var(--muted));border-radius:999px;padding:2px 8px;margin-right:6px;
  }
  .group-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}
  .group-chip{
    border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;background:#fff;
    font-size:15px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;text-align:left;
  }
  .group-chip i{width:16px;height:16px;border-radius:50%;background:var(--g,var(--muted));display:inline-block;flex:none}
  .group-chip.on{border-color:var(--g,var(--green));background:var(--gbg,#fff);box-shadow:inset 0 -4px 0 var(--g,var(--green))}
  .group-chip.none.on{border-color:var(--green);box-shadow:none}
  .group-name-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .group-name-row i{width:18px;height:18px;border-radius:50%;background:var(--g,var(--muted));display:inline-block;flex:none}
  .pref-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
  .pref-chip{border:1.5px solid var(--line);border-radius:12px;padding:9px 8px;background:#fff;font-size:15px;font-weight:800;color:var(--ink);text-align:center}
  .pref-chip.on{border-color:var(--green);background:var(--green-lt);color:var(--green-dk);box-shadow:inset 0 -4px 0 var(--green)}
  .pref-label{display:inline-flex;align-items:center;font-size:12px;font-weight:800;color:var(--green-dk);background:var(--green-lt);border:1px solid #BBD8C3;border-radius:999px;padding:2px 8px;margin-right:6px}
  .hint{color:var(--muted);font-size:15px;line-height:1.6}

  .roster-strip{display:flex;gap:8px;overflow-x:auto;padding:0 2px 10px;-webkit-overflow-scrolling:touch}
  .roster-strip .pbtn{flex:none;padding:9px 14px}
  .roster-strip:empty{display:none}

  .rc-start{
    display:block;width:100%;max-width:430px;margin:0 auto 14px;
    background:var(--green);color:#fff;border:none;border-radius:16px;
    padding:20px;font-size:24px;font-weight:800;letter-spacing:.1em;
    box-shadow:0 3px 0 var(--green-dk);
  }
  .rc-start:active{transform:translateY(2px);box-shadow:none}
  .rc-done{background:#fff;color:var(--green);border:2.5px solid var(--green);box-shadow:none}

  /* ── 彈出視窗 ── */
  .overlay{
    position:fixed;inset:0;background:rgba(30,40,36,.45);display:none;
    align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.show{display:flex}
  .sheet{
    background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;
    padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);
    max-height:88vh;overflow-y:auto;
  }
  .sheet h2{font-size:22px;font-weight:800;margin-bottom:2px}
  .sheet .note{font-size:15px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .sheet .note b{color:var(--ink)}
  .acts{display:flex;flex-direction:column;gap:10px}
  .act{
    width:100%;padding:15px;font-size:18px;font-weight:700;border-radius:12px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);text-align:center;
  }
  .act.primary{background:var(--green);border-color:var(--green);color:#fff}
  .act.danger{color:var(--red);border-color:#E4C4BF}
  .act.cancel{border:none;color:var(--muted);font-weight:600;padding:10px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input,.field textarea{
    width:100%;padding:12px;font-size:18px;font-family:inherit;
    border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  }
  .field textarea{min-height:90px;resize:vertical}
  .row2{display:flex;gap:10px}
  .row2 .act{flex:1}
  .listrow{
    display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #EDEFEC;
  }
  .listrow .grow{flex:1;min-width:0}
  .listrow .nm{font-size:17px;font-weight:700}
  .listrow .nm small{font-weight:400;color:var(--muted);font-size:13px;display:block}
  .mini{
    background:#fff;border:1.5px solid var(--line);border-radius:8px;
    padding:7px 12px;font-size:14px;font-weight:600;color:var(--ink);flex:none;
  }
  .mini.off{color:var(--muted)}


  /* ── 手機版名單總覽 ── */
  .roster-grid-btn{display:none}
  .roster-grid-sheet{max-width:760px;border-radius:20px 20px 0 0;padding-top:16px}
  .grid-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
  .grid-tab{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 13px;font-size:15px;font-weight:800}
  .grid-tab.on{background:var(--green);border-color:var(--green);color:#fff}
  .member-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:8px}
  .member-card{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 10px;min-height:78px;color:var(--ink);font-size:16px;font-weight:800;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .member-card .name{display:block;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
  .member-card .meta{display:block;margin-top:7px;font-size:13px;font-weight:700;color:var(--muted);line-height:1.3}
  .member-card .badges{position:absolute;right:8px;top:8px;display:flex;gap:4px}
  .member-card .pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;min-width:20px;height:20px;padding:0 5px;font-size:11px;font-weight:900;border:1px solid transparent}
  .member-card .pill.note{background:#FFE39B;border-color:#D6A437;color:#7A4B00}
  .member-card .pill.phone{background:#EEF6FF;border-color:#B8CBE1;color:#355C80}
  .member-card.leave{background:#F1F2F0;color:#98A09B;border-color:#C9CEC9}
  .member-card.unassigned{border-color:#DDBB64;background:#FFF9E8}
  .member-card.assigned{border-color:#9DB3A6;background:#F4F8F5}
  .member-card.missing{border-color:var(--red);background:#FFF0F0;box-shadow:inset 0 -5px 0 rgba(192,57,43,.70)}
  .member-card.boarded{border-color:var(--green);background:var(--green-lt);box-shadow:inset 0 -5px 0 var(--green)}
  .grid-summary{font-size:14px;color:var(--muted);line-height:1.5;margin:-4px 0 10px}

  #toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);
    transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:11px 20px;border-radius:999px;font-size:16px;font-weight:600;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;white-space:nowrap;
    max-width:92vw;overflow:hidden;text-overflow:ellipsis;
  }
  #toast.show{opacity:1}

  footer{
    text-align:center;padding:10px 0 calc(env(safe-area-inset-bottom) + 14px);
    font-size:13px;color:var(--muted);
  }
  footer button{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 8px}



  /* ── 手機版修正：避免狀態列、未排名單、車圖互相壓住 ── */
  @media (max-width:899px){
    header{padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
    .trip-name{font-size:19px}
    .trip-sub{font-size:12px;flex-wrap:wrap;gap:5px}
    .btn-share{padding:8px 12px;font-size:15px;white-space:nowrap}
    nav button{padding:12px 4px;font-size:18px}
    .statusbar{
      padding:8px 12px;font-size:15px;line-height:1.35;
      gap:6px;min-height:0;align-items:flex-start;position:relative;z-index:5;
      overflow:visible;
    }
    .statusbar .status-hint{flex:1 1 100%;min-width:0}
    .statusbar .big{font-size:19px}
    .statusbar .chip,.statusbar .barbtn{font-size:14px;padding:5px 10px;line-height:1.25}
    .roster-grid-btn{display:inline-flex;align-items:center}
    .statusbar .chip.miss{font-size:14px;padding:5px 9px}
    main{display:block;padding:8px 10px 14px;overflow-x:hidden}
    .chart-wrap{width:100%;overflow:visible}
    .roster-strip{
      position:relative;z-index:4;display:flex;gap:8px;
      padding:0 16px 10px 2px;margin:0 0 6px 0;
      overflow-x:auto;overflow-y:hidden;max-width:100%;
      -webkit-overflow-scrolling:touch;
    }
    .roster-strip .pbtn{
      flex:0 0 auto;min-width:128px;max-width:168px;
      padding:10px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .roster-strip .pbtn small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bus{max-width:calc(100vw - 20px);margin:0 auto;padding:10px 10px 14px}
    .rc-start{max-width:calc(100vw - 20px);margin:0 auto 12px;padding:18px;font-size:23px}
    footer{padding-bottom:calc(env(safe-area-inset-bottom) + 18px)}
    .sheet{padding-bottom:calc(env(safe-area-inset-bottom) + 34px)}
    .roster-grid-sheet{max-height:92vh}
    .member-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .member-card{padding:11px 9px;min-height:76px}
  }

  @media (min-width:900px){
    aside{display:flex}
    .roster-strip{display:none}
    :root{--seat-h:50px}
  }
</style>
</head>
<body>

<header>
  <div class="trip-row">
    <button class="trip-btn" onclick="openTrips()">
      <div class="trip-name" id="tripName">—</div>
      <div class="trip-sub">
        <span id="tripDate"></span>
        <span class="syncdot" id="syncdot"><i></i><span id="syncText">尚未設定同步</span></span>
      </div>
    </button>
    <button class="btn-share" onclick="shareChart()">傳到 LINE</button>
  </div>
</header>

<nav>
  <button id="tab-seat" class="on" onclick="setMode('seat')">排座位</button>
  <button id="tab-att"  onclick="setMode('att')">出席</button>
  <button id="tab-rc"   onclick="setMode('rc')">點名</button>
</nav>

<div class="statusbar" id="statusbar"></div>
<div class="pending" id="pending">
  <span id="pendingText"></span>
  <button onclick="cancelPending()">取消</button>
</div>

<main>
  <div class="chart-wrap">
    <div class="roster-strip" id="rosterStrip"></div>
    <button class="rc-start" id="rcBtn" style="display:none" onclick="toggleRollcall()">開始點名</button>
    <div class="bus" id="busBox">
      <div class="bus-head">車　頭</div>
      <div class="cabin">
        <div class="col" id="colL"></div>
        <div class="aisle"></div>
        <div class="col" id="colR"></div>
      </div>
    </div>
  </div>
  <aside>
    <div class="panel">
      <h3 id="asideTitle">尚未排座位</h3>
      <div class="plist" id="rosterSide"></div>
    </div>
  </aside>
</main>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<div id="toast"></div>

<footer>
  <span id="appVersionText">山友團座位表 v5.5.1</span>
  <button onclick="openVersionInfo()">版本資訊</button>
  <button onclick="openAdmin()">管理（維護者用）</button>
</footer>

<script>
"use strict";
/* ══════════════════ 座位版型 ══════════════════
   換車時：在 LAYOUTS 新增一個版本（例如 v2），
   再把 DEFAULT_LAYOUT 改成 'v2'。舊行程仍會用舊版型顯示。 */
const LAYOUTS = {
  v1: {
    left: [
      {type:'seats', rows:7, zone:'LF'},
      {type:'gap',   label:'中門'},
      {type:'seats', rows:5, zone:'LB'},
    ],
    right: [
      {type:'gap',   label:'前門', grow:true},
      {type:'seats', rows:5, zone:'RF'},
      {type:'gap',   label:'出入口'},
      {type:'seats', rows:4, zone:'RB'},
    ],
  },
};
const DEFAULT_LAYOUT = 'v1';

/* 依版型產生座位清單（編號順序：左前→右前→左後→右後） */
const _seatCache = {};
function seatsOf(layoutV){
  if(_seatCache[layoutV]) return _seatCache[layoutV];
  const L = LAYOUTS[layoutV] || LAYOUTS[DEFAULT_LAYOUT];
  const zones = [
    ...L.left.filter(b=>b.type==='seats'),
    ...L.right.filter(b=>b.type==='seats'),
  ];
  const order = zones.map(z=>z.zone); /* 依版型定義順序編號 */
  const seats=[]; let no=1;
  order.forEach(z=>{
    const blk=zones.find(b=>b.zone===z);
    for(let r=0;r<blk.rows;r++)for(let c=0;c<2;c++)
      seats.push({id:z+'-'+r+'-'+c, no:no++, zone:z, row:r, col:c});
  });
  _seatCache[layoutV]=seats;
  return seats;
}

/* ══════════════════ 資料 ══════════════════ */
const APP_VERSION='v5.5.1';
const APP_BUILD='2026-07-06 熱修';
const APP_NAME='山友團座位表';
const KEY='bustool-v2';
const SYNCKEY='bustool-sync';
let DB;   /* {members:[{id,name,phone,group,seatPref,note,inactive}], groupNames, membersUpdatedAt, trips:[...]} */

function nowTs(){ return Date.now(); }
function newId(p){ return p + nowTs().toString(36) + Math.random().toString(36).slice(2,6); }

function emptyDB(){
  return {v:5, members:[], groupNames:{}, membersUpdatedAt:0, trips:[]};
}
function newTripObj(name, dateText, copyFrom){
  const t = {
    id:newId('t'), name:name||'新的出遊', dateText:dateText||'',
    layoutV:DEFAULT_LAYOUT, assign:{}, leave:[], boarded:[], rcActive:false,
    createdAt:nowTs(), updatedAt:nowTs(),
  };
  if(copyFrom){
    const valid = new Set(seatsOf(t.layoutV).map(s=>s.id));
    Object.keys(copyFrom.assign||{}).forEach(sid=>{
      if(valid.has(sid)) t.assign[sid]=copyFrom.assign[sid];
    });
  }
  return t;
}
function load(){
  try{ DB = JSON.parse(localStorage.getItem(KEY)) || emptyDB(); }
  catch(e){ DB = emptyDB(); }
  DB.v = 5;
  DB.groupNames = {...defaultGroupNames(), ...(DB.groupNames||{})};
  DB.members = (DB.members||[]).map(normalizeMember);
  if(!DB.trips.length){
    DB.trips.push(newTripObj('第一次出遊', todayText(), null));
  }
}
function persist(){ localStorage.setItem(KEY, JSON.stringify(DB)); }
function todayText(){
  const d=new Date();
  return (d.getMonth()+1)+' 月 '+d.getDate()+' 日';
}

/* 目前檢視的行程；最新建立的那個行程才能編輯 */
let viewId=null;
function latestTrip(){
  return DB.trips.slice().sort((a,b)=>b.createdAt-a.createdAt)[0];
}
function trip(){ return DB.trips.find(t=>t.id===viewId) || latestTrip(); }
function editable(){ const t=trip(); return t && t.id===latestTrip().id; }
function touch(){
  const t=trip(); if(t) t.updatedAt=nowTs();
  persist(); schedulePush();
}
function touchMembers(){
  DB.membersUpdatedAt=nowTs();
  persist(); schedulePush();
}

let mode='seat';
let pending=null; /* {kind:'assign',memberId} | {kind:'move',fromSeat} */
let undoState=null; /* 只保留目前行程上一個操作，用於現場快速復原 */

const GROUPS = [
  {id:'1', name:'群組 1', cls:'g1', color:'#D96B6B', fill:'#FFF1F1'},
  {id:'2', name:'群組 2', cls:'g2', color:'#D98B3A', fill:'#FFF4E8'},
  {id:'3', name:'群組 3', cls:'g3', color:'#C6A022', fill:'#FFF8D9'},
  {id:'4', name:'群組 4', cls:'g4', color:'#5FA864', fill:'#ECF8ED'},
  {id:'5', name:'群組 5', cls:'g5', color:'#2F9A8E', fill:'#E9F7F5'},
  {id:'6', name:'群組 6', cls:'g6', color:'#4C8EDB', fill:'#EEF6FF'},
  {id:'7', name:'群組 7', cls:'g7', color:'#6D79D8', fill:'#F0F1FF'},
  {id:'8', name:'群組 8', cls:'g8', color:'#9A6AD8', fill:'#F6F0FF'},
  {id:'9', name:'群組 9', cls:'g9', color:'#C767A8', fill:'#FFF0F8'},
  {id:'10', name:'群組 10', cls:'g10', color:'#8A7B68', fill:'#F3F0EB'},
];
const SEAT_PREFS = [
  {id:'', name:'無偏好', csv:'無偏好'},
  {id:'aisle', name:'走道', csv:'走道優先'},
  {id:'window', name:'靠窗', csv:'靠窗優先'},
  {id:'front', name:'前排', csv:'前排優先'},
  {id:'rear', name:'後排', csv:'後排優先'},
];

/* ══════════════════ 小工具 ══════════════════ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const memberById=id=>DB.members.find(m=>m.id===id);
const activeMembers=()=>DB.members.filter(m=>!m.inactive);
const seatOf=mid=>Object.keys(trip().assign).find(k=>trip().assign[k]===mid);
const isLeave=mid=>trip().leave.includes(mid);
const rcTargets=t=>Object.keys(t.assign||{}).filter(sid=>!t.leave.includes(t.assign[sid]));
const rcMissing=t=>rcTargets(t).filter(sid=>!(t.boarded||[]).includes(sid));
const rcComplete=t=>!!(t.rcActive && rcTargets(t).length && rcMissing(t).length===0);
const cleanPhone=p=>String(p||'').trim();
function defaultGroupNames(){
  const o={}; GROUPS.forEach(g=>o[g.id]=g.name); return o;
}
function groupName(id){
  const g=GROUPS.find(x=>x.id===String(id));
  return g ? ((DB&&DB.groupNames&&DB.groupNames[g.id]) || g.name) : '';
}
function validGroup(g){
  const raw=String(g||'').trim();
  const n=raw.replace(/^群組\s*/,'').trim();
  if(GROUPS.some(x=>x.id===n)) return n;
  const hit=GROUPS.find(x=>groupName(x.id)===raw || x.name===raw);
  return hit ? hit.id : '';
}
function groupInfo(g){
  const id=validGroup(g);
  const base=GROUPS.find(x=>x.id===id);
  return base ? {...base, name:groupName(base.id)} : null;
}
function groupClassName(m){ const g=groupInfo(m&&m.group); return g ? g.cls : ''; }
function groupLabel(m){ const g=groupInfo(m&&m.group); return g ? g.name : ''; }
function groupBadge(m){ const g=groupInfo(m&&m.group); return g ? '<span class="grp">'+esc(g.id)+'</span>' : ''; }
function hasMemberNote(m){ return !!String((m&&m.note)||'').trim(); }
function noteBadge(m){ return hasMemberNote(m) ? '<span class="note-badge" title="有備註">備</span>' : ''; }
function validSeatPref(v){
  const raw=String(v||'').trim();
  if(!raw || raw==='無偏好') return '';
  const map={'走道':'aisle','走道優先':'aisle','aisle':'aisle','靠走道':'aisle','靠窗':'window','靠窗優先':'window','window':'window','窗邊':'window','前排':'front','前排優先':'front','front':'front','坐前面':'front','後排':'rear','後排優先':'rear','rear':'rear','坐後面':'rear'};
  return map[raw] || '';
}
function seatPrefName(v){
  const id=validSeatPref(v);
  const p=SEAT_PREFS.find(x=>x.id===id);
  return p ? p.name : '無偏好';
}
function seatPrefCsv(v){
  const id=validSeatPref(v);
  const p=SEAT_PREFS.find(x=>x.id===id);
  return p ? p.csv : '無偏好';
}
function seatPrefLabel(m){
  const id=validSeatPref(m&&m.seatPref);
  return id ? '<span class="pref-label">'+esc(seatPrefName(id))+'</span>' : '';
}
function seatPrefPickerHtml(id, value){
  const v=validSeatPref(value);
  return '<input type="hidden" id="'+id+'" value="'+esc(v)+'">'+
    '<div class="pref-picker" data-pref-picker="'+id+'">'+
      SEAT_PREFS.map(p=>'<button type="button" class="pref-chip '+(v===p.id?'on':'')+'" onclick="selectSeatPref(\''+id+'\',\''+p.id+'\')">'+esc(p.name)+'</button>').join('')+
    '</div>';
}
function selectSeatPref(id, value){
  const input=$(id); if(!input) return;
  input.value=validSeatPref(value);
  const box=document.querySelector('[data-pref-picker="'+id+'"]');
  if(!box) return;
  box.querySelectorAll('.pref-chip').forEach(btn=>btn.classList.remove('on'));
  const ix=SEAT_PREFS.findIndex(p=>p.id===input.value);
  const btn=box.querySelectorAll('.pref-chip')[ix>=0?ix:0];
  if(btn) btn.classList.add('on');
}
function normalizeMember(m){
  return {...m, phone:cleanPhone(m&&m.phone), lineUrl:cleanLineUrl(m&&m.lineUrl), group:validGroup(m&&m.group), seatPref:validSeatPref(m&&m.seatPref)};
}
function groupPickerHtml(id, value){
  const v=validGroup(value);
  return '<input type="hidden" id="'+id+'" value="'+esc(v)+'">'+
    '<div class="group-picker" data-picker="'+id+'">'+
      '<button type="button" class="group-chip none '+(v?'':'on')+'" onclick="selectGroup(\''+id+'\',\''+'\')"><i style="background:#B9C4BE"></i>不指定</button>'+
      GROUPS.map(g=>'<button type="button" class="group-chip '+g.cls+' '+(v===g.id?'on':'')+'" onclick="selectGroup(\''+id+'\',\''+g.id+'\')"><i></i>'+esc(groupName(g.id))+'</button>').join('')+
    '</div>';
}
function selectGroup(id, value){
  const input=$(id); if(!input) return;
  input.value=validGroup(value);
  const box=document.querySelector('[data-picker="'+id+'"]');
  if(!box) return;
  box.querySelectorAll('.group-chip').forEach(btn=>btn.classList.remove('on'));
  const ix=input.value ? GROUPS.findIndex(g=>g.id===input.value)+1 : 0;
  const btn=box.querySelectorAll('.group-chip')[ix];
  if(btn) btn.classList.add('on');
}
function memberStatusText(m){ return isLeave(m&&m.id) ? '請假' : '出席'; }
function memberMeta(m, opts={}){
  const parts=[];
  if(opts.status && m) parts.push(memberStatusText(m));
  const gl=groupLabel(m); if(gl) parts.push(gl);
  const sp=validSeatPref(m&&m.seatPref); if(sp) parts.push('偏好：'+seatPrefName(sp));
  if(opts.phone && m&&m.phone) parts.push('電話：'+m.phone);
  if(m&&m.note) parts.push(m.note);
  return parts.join('　');
}

function cleanLineUrl(v){
  let s=String(v||'').trim();
  if(!s) return '';
  /* 允許直接貼 line.me 連結；若只貼 @ID，轉成 LINE 開啟入口。 */
  if(/^@/.test(s)) return 'https://line.me/R/ti/p/'+encodeURIComponent(s);
  if(/^line:\/\//i.test(s)) return s;
  if(/^https?:\/\//i.test(s)) return s;
  /* 一般文字不要自動當網址，避免誤開錯人。 */
  return s;
}
function lineHref(v){
  const s=cleanLineUrl(v);
  if(!s) return '';
  if(/^line:\/\//i.test(s) || /^https?:\/\//i.test(s)) return s;
  return '';
}
function openLine(mid){
  const m=memberById(mid);
  const href=m ? lineHref(m.lineUrl) : '';
  if(!href){ toast('尚未填 LINE'); return; }
  location.href=href;
}
function openLineEditor(mid){
  const m=memberById(mid); if(!m) return;
  sheetHTML('<h2>補 LINE：'+esc(m.name)+'</h2>'+ 
    '<div class="note">貼上對方提供的 LINE 連結，例如 https://line.me/ti/p/xxxxxx。這是開啟 LINE 資料／加好友入口，不保證直接撥 LINE 電話。</div>'+ 
    '<div class="field"><label>LINE 連結</label><input id="quickLine" inputmode="url" value="'+esc(m.lineUrl||'')+'" placeholder="例如：https://line.me/ti/p/xxxxxx"></div>'+ 
    '<div class="acts">'+
      '<button class="act primary" onclick="saveQuickLine(\''+m.id+'\',false)">儲存 LINE</button>'+ 
      '<button class="act" onclick="saveQuickLine(\''+m.id+'\',true)">儲存後開啟 LINE</button>'+ 
      '<button class="act cancel" onclick="closeSheet()">取消</button></div>');
  setTimeout(()=>$('quickLine').focus(),100);
}
function saveQuickLine(mid, openAfter){
  const m=memberById(mid); if(!m) return;
  const line=cleanLineUrl($('quickLine').value);
  if(!line){ toast('請先輸入 LINE 連結'); return; }
  m.lineUrl=line;
  touchMembers(); closeSheet(); renderAll(); toast('LINE 已儲存');
  if(openAfter && lineHref(m.lineUrl)) setTimeout(()=>openLine(mid),150);
}

function telHref(p){
  const n=cleanPhone(p).replace(/[^0-9+*#,;]/g,'');
  return n ? 'tel:'+n : '';
}
function callMember(mid){
  const m=memberById(mid);
  if(!m || !telHref(m.phone)){
    toast('尚未填電話');
    return;
  }
  location.href = telHref(m.phone);
}
function toast(t){
  const el=$('toast'); el.textContent=t; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1800);
}
function saveUndo(label){
  const t=trip(); if(!t || !editable()) return;
  undoState={
    tripId:t.id, label:label||'上一個動作',
    assign:JSON.stringify(t.assign||{}),
    leave:JSON.stringify(t.leave||[]),
    boarded:JSON.stringify(t.boarded||[]),
    rcActive:!!t.rcActive
  };
}
function undoLabelHtml(){
  return undoState && undoState.tripId===trip().id ? '<button class="barbtn primary" onclick="restoreUndo()">復原：'+esc(undoState.label)+'</button>' : '';
}
function restoreUndo(){
  const t=trip();
  if(!undoState || !t || undoState.tripId!==t.id){ toast('沒有可復原的動作'); return; }
  t.assign=JSON.parse(undoState.assign||'{}');
  t.leave=JSON.parse(undoState.leave||'[]');
  t.boarded=JSON.parse(undoState.boarded||'[]');
  t.rcActive=!!undoState.rcActive;
  undoState=null; pending=null; touch(); renderAll(); toast('已復原上一個動作');
}
function markLeave(mid, leave, label){
  const t=trip(); if(!editable()) return;
  const i=t.leave.indexOf(mid);
  const want = leave===undefined ? i<0 : !!leave;
  if(want && i<0){ saveUndo(label||'出席狀態'); t.leave.push(mid); t.boarded=t.boarded.filter(sid=>t.assign[sid]!==mid); touch(); renderAll(); }
  else if(!want && i>=0){ saveUndo(label||'出席狀態'); t.leave.splice(i,1); touch(); renderAll(); }
}
function toggleLeaveMember(mid){
  const m=memberById(mid); if(!m) return;
  const was=isLeave(mid);
  markLeave(mid, !was, was?'取消請假':'標記請假');
  toast((m?m.name:'')+(was?' 取消請假，會出席':' 標記請假'));
}

/* ══════════════════ 畫面 ══════════════════ */
function renderHeader(){
  const t=trip();
  $('tripName').textContent = t.name + (editable()?'':'（舊行程）');
  $('tripDate').textContent = t.dateText || '';
}

function renderBus(){
  const t=trip();
  const L=LAYOUTS[t.layoutV]||LAYOUTS[DEFAULT_LAYOUT];
  const seats=seatsOf(t.layoutV);
  const bus=$('busBox');
  if(bus){
    bus.classList.remove('rc-missing','rc-complete');
    if(mode==='rc' && t.rcActive){
      bus.classList.add(rcComplete(t)?'rc-complete':'rc-missing');
    }
  }
  ['left','right'].forEach(side=>{
    const col = side==='left'?$('colL'):$('colR');
    col.innerHTML='';
    L[side].forEach(blk=>{
      if(blk.type==='gap'){
        const d=document.createElement('div');
        d.className='space'+(blk.grow?' grow':'');
        d.innerHTML='<span>'+esc(blk.label)+'</span>';
        col.appendChild(d);
      }else{
        for(let r=0;r<blk.rows;r++){
          const rowEl=document.createElement('div');
          rowEl.className='seatrow';
          for(let c=0;c<2;c++){
            const seat=seats.find(s=>s.zone===blk.zone&&s.row===r&&s.col===c);
            rowEl.appendChild(seatEl(seat));
          }
          col.appendChild(rowEl);
        }
      }
    });
  });
}

function seatEl(seat){
  const t=trip();
  const mid=t.assign[seat.id];
  const m=mid?memberById(mid):null;
  const el=document.createElement('button');
  el.className='seat';
  el.innerHTML='<span class="no">'+seat.no+'</span>';
  if(mid){
    el.classList.add('occ');
    const gc=groupClassName(m); if(gc) el.classList.add(gc);
    el.insertAdjacentHTML('beforeend', groupBadge(m));
    el.insertAdjacentHTML('beforeend', noteBadge(m));
    el.insertAdjacentText('beforeend', m?m.name:'（已移除）');
    if(isLeave(mid)){
      el.classList.add('leave');
      el.insertAdjacentHTML('beforeend','<span class="tag">請假</span>');
    }else if(mode==='rc' && t.boarded.includes(seat.id)){
      el.classList.add('boarded');
    }
  }
  if(pending && pending.kind==='move' && pending.fromSeat===seat.id) el.classList.add('sel');
  el.onclick=()=>tapSeat(seat);
  return el;
}

function renderRoster(){
  const t=trip();
  const seated=new Set(Object.values(t.assign));
  const un = activeMembers().filter(m=>!seated.has(m.id));
  let html;
  if(!DB.members.length){
    html='<div class="hint">名冊還是空的。<br>請維護者到下方「管理」新增山友名單，或匯入名冊 CSV。</div>';
  }else{
    html = un.map(m=>{
      const sel = pending&&pending.kind==='assign'&&pending.memberId===m.id?' sel':'';
      const gc = groupClassName(m);
      const leave = isLeave(m.id);
      const meta = memberMeta(m,{status:true});
      const action = mode==='att' ? 'toggleLeaveMember' : 'tapMember';
      return '<button class="pbtn'+sel+(gc?' '+gc:'')+(leave?' leave':'')+'" onclick="'+action+'(\''+m.id+'\')">'+groupBadge(m)+esc(m.name)+
        (meta?'<small><span class="state">'+esc(memberStatusText(m))+'</span>'+esc(meta.replace(memberStatusText(m),'') ? '　'+meta.replace(memberStatusText(m)+'　','').replace(memberStatusText(m),'') : '')+'</small>':'')+'</button>';
    }).join('') || '<div class="hint">全部都排好了 ✓</div>';
  }
  $('rosterSide').innerHTML = html;
  $('rosterStrip').innerHTML = ((mode==='seat' || mode==='att') && editable()) ? html : '';
  $('asideTitle').textContent = mode==='att' ? '未排座也可標請假（'+un.length+' 人）' : '尚未排座位（'+un.length+' 人）';
}

function renderStatus(){
  const sb=$('statusbar');
  sb.classList.remove('rc-warn','rc-ok');
  const t=trip();
  const ro = editable()? '' : '<span class="chip ro">舊行程・只能查看</span>';
  const active=activeMembers();
  const leaveN=active.filter(m=>t.leave.includes(m.id)).length;
  const goN=active.length-leaveN;
  const assignedN=Object.keys(t.assign||{}).length;
  const undo=(editable() && mode!=='rc')?undoLabelHtml():'';
  const gridBtn='<button class="barbtn primary roster-grid-btn" onclick="openRosterGrid()">名單總覽</button>';
  if(mode==='seat'){
    const seated=new Set(Object.values(t.assign));
    const un=active.filter(m=>!seated.has(m.id)).length;
    const fillable=active.filter(m=>!seated.has(m.id)&&!isLeave(m.id)).length;
    const free=seatsOf(t.layoutV).filter(s=>!t.assign[s.id]).length;
    sb.innerHTML=ro+'<span class="status-hint">點<b>名單上的人</b>，再點<b>空位</b>。未排名單會直接顯示出席／請假。</span>'+gridBtn+undo+
      (fillable&&free?'<button class="barbtn primary" onclick="openAutoFillSeats()">自動填滿剩餘空位</button>':'')+
      (assignedN?'<button class="barbtn danger" onclick="openClearSeats()">全部移出座位</button>':'')+
      (un?'<span class="chip">還有 '+un+' 人未排</span>':'<span class="chip ok">全部排好 ✓</span>');
  }else if(mode==='att'){
    sb.innerHTML=ro+'<span class="big ok">出席 '+goN+' 人</span><span class="big" style="color:var(--muted)">請假 '+leaveN+' 人</span>'+gridBtn+undo+
      '<span style="font-size:14px;color:var(--muted)">點座位或右邊未排名單，都能標請假／取消請假</span>';
  }else{
    const targets=rcTargets(t);
    if(!t.rcActive){
      sb.innerHTML=ro+'<span class="status-hint">到休息站，按「開始點名」，大家回車時點座位打勾。</span>'+gridBtn+undo;
    }else{
      const missing=rcMissing(t);
      if(missing.length===0 && targets.length){
        sb.classList.add('rc-ok');
        sb.innerHTML='<span class="big ok">全員到齊 ✓（'+targets.length+' 人）</span>'+gridBtn+undo+
          '<span style="font-size:14px;color:var(--green)">座位表外框已轉綠，這一輪點名完成。</span>';
      }else{
        sb.classList.add('rc-warn');
        sb.innerHTML='<span class="big warn">點名中，還差 '+missing.length+' 人</span>'+gridBtn+undo+
          '<span style="font-size:14px;color:var(--red)">紅框代表尚未完成。</span>'+
          missing.map(sid=>{
            const m=memberById(t.assign[sid]);
            return '<button class="chip miss" onclick="openContactActionsBySeat(\''+sid+'\')">'+esc(m?m.name:'?')+'</button>';
          }).join('');
      }
    }
  }
}

function renderRcBtn(){
  const b=$('rcBtn');
  if(mode!=='rc' || !editable()){ b.style.display='none'; return; }
  b.style.display='block';
  const t=trip();
  if(t.rcActive){
    b.textContent=rcComplete(t)?'點名完成，結束這一輪':'結束這一輪點名';
    b.classList.add('rc-done');
  }
  else{ b.textContent='開始點名'; b.classList.remove('rc-done'); }
}

function renderPending(){

  p.classList.add('show');
  const m = pending.kind==='assign' ? memberById(pending.memberId) : memberById(trip().assign[pending.fromSeat]);
  $('pendingText').textContent = pending.kind==='assign'
    ? '請點「'+(m?m.name:'')+'」要坐的座位'
    : '請點「'+(m?m.name:'')+'」要換到的座位';
}

function renderAll(){
  renderHeader(); renderBus(); renderRoster(); renderStatus(); renderRcBtn(); renderPending();
  persist();
}

/* ══════════════════ 互動 ══════════════════ */
function setMode(m){
  mode=m; pending=null;
  ['seat','att','rc'].forEach(x=>$('tab-'+x).classList.toggle('on',x===m));
  renderAll();
}
function tapMember(mid){
  if(!editable()) return;
  if(mode==='att'){ toggleLeaveMember(mid); return; }
  if(mode!=='seat') return;
  pending = (pending&&pending.kind==='assign'&&pending.memberId===mid) ? null : {kind:'assign',memberId:mid};
  renderAll();
}
function cancelPending(){ pending=null; renderAll(); }

function tapSeat(seat){
  const t=trip();
  const mid=t.assign[seat.id];

  if(!editable()){
    if(mid){
      openContactActions(seat, mid, true);
    }
    return;
  }

  if(pending){
    if(pending.kind==='assign'){
      if(!mid){
        saveUndo('安排座位');
        t.assign[seat.id]=pending.memberId;
        toast(memberById(pending.memberId).name+' → '+seat.no+' 號');
        pending=null; touch(); renderAll();
      }else{
        const newP=memberById(pending.memberId), cur=memberById(mid);
        openActs(seat.no+' 號已有 '+(cur?cur.name:''),
          '要讓 <b>'+esc(newP.name)+'</b> 坐這裡嗎？'+esc(cur?cur.name:'')+' 會變成沒有座位。',[
          {t:'換成 '+newP.name+' 坐', cls:'primary', fn:()=>{
            saveUndo('換成他坐');
            t.assign[seat.id]=pending.memberId; pending=null; closeSheet(); touch(); renderAll();
          }},
        ]);
      }
    }else if(pending.kind==='move'){
      if(seat.id===pending.fromSeat){ pending=null; renderAll(); return; }
      saveUndo('換位');
      const from=pending.fromSeat;
      const a=t.assign[from], b=t.assign[seat.id];
      t.assign[seat.id]=a;
      if(b) t.assign[from]=b; else delete t.assign[from];
      toast(b?'兩人互換完成':'換位完成');
      pending=null; touch(); renderAll();
    }
    return;
  }

  if(mode==='rc'){
    if(!mid) return;
    if(t.leave.includes(mid)){ const m=memberById(mid); toast((m?m.name:'')+' 今天請假'); return; }
    if(!t.rcActive){ toast('先按上面的「開始點名」'); return; }
    const i=t.boarded.indexOf(seat.id);
    if(i>=0) t.boarded.splice(i,1); else t.boarded.push(seat.id);
    touch(); renderAll();
    return;
  }

  if(mode==='att'){
    if(!mid) return;
    toggleLeaveMember(mid);
    return;
  }

  /* 排座位模式：點已有人的座位 */
  if(!mid) return;
  const m=memberById(mid);
  openActs(seat.no+' 號・'+(m?m.name:'（已移除）'),
    contactNote(m),[
    {t:'換位（再點一個座位）', cls:'primary', fn:()=>{ pending={kind:'move',fromSeat:seat.id}; closeSheet(); renderAll(); }},
    {t:isLeave(mid)?'取消請假':'標記請假', fn:()=>{
      saveUndo(isLeave(mid)?'取消請假':'標記請假');
      const i=t.leave.indexOf(mid);
      if(i>=0)t.leave.splice(i,1); else t.leave.push(mid);
      closeSheet(); touch(); renderAll();
    }},
    {t:(m&&telHref(m.phone))?'撥打電話：'+cleanPhone(m.phone):'尚未填電話（點此補電話）', fn:()=>{ if(!m) return; if(telHref(m.phone)) callMember(m.id); else openPhoneEditor(m.id); }},
    {t:(m&&lineHref(m.lineUrl))?'開啟 LINE':'尚未填 LINE（點此補 LINE）', fn:()=>{ if(!m) return; if(lineHref(m.lineUrl)) openLine(m.id); else openLineEditor(m.id); }},
    {t:'編輯備註', fn:()=>{ if(m) openNoteEditor(m); }},
    {t:'移出座位（回到未排名單）', cls:'danger', fn:()=>{
      saveUndo('移出座位');
      delete t.assign[seat.id]; closeSheet(); touch(); renderAll();
      toast((m?m.name:'')+' 回到未排名單');
    }},
  ]);
}

function toggleRollcall(){
  const t=trip();
  if(!t.rcActive){ t.rcActive=true; t.boarded=[]; toast('開始點名，大家回車時點座位'); }
  else{ t.rcActive=false; t.boarded=[]; }
  touch(); renderAll();
}
function openClearSeats(){
  const t=trip();
  const n=Object.keys(t.assign||{}).length;
  if(!editable() || !n){ toast('目前沒有已安排座位'); return; }
  openActs('全部移出座位','會把目前行程的 '+n+' 個座位全部清空，人會回到未排名單。請假狀態會保留。',[
    {t:'確定全部移出座位', cls:'danger', fn:()=>clearAllSeats()},
  ]);
}
function clearAllSeats(){
  const t=trip();
  saveUndo('全部移出座位');
  t.assign={}; t.boarded=[]; pending=null; closeSheet(); touch(); renderAll(); toast('已全部移出座位');
}
function seatRole(seat){
  const left=String(seat.zone||'').startsWith('L');
  const right=String(seat.zone||'').startsWith('R');
  const aisle=(left&&seat.col===1)||(right&&seat.col===0);
  const win=(left&&seat.col===0)||(right&&seat.col===1);
  return {aisle, window:win};
}
function sameGroupDistanceScore(seat, m, t){
  const g=validGroup(m&&m.group);
  if(!g) return 0;
  const seats=seatsOf(t.layoutV);
  let best=999;
  Object.keys(t.assign||{}).forEach(sid=>{
    const other=memberById(t.assign[sid]);
    if(other && other.id!==m.id && validGroup(other.group)===g){
      const os=seats.find(x=>x.id===sid);
      if(os) best=Math.min(best, Math.abs(os.no-seat.no));
    }
  });
  return best===999 ? 0 : Math.min(best,10)*3;
}
function autoSeatScore(seat, m, t){
  const role=seatRole(seat);
  const pref=validSeatPref(m&&m.seatPref);
  let score=seat.no/100;
  if(pref==='aisle') score += role.aisle ? 0 : 1000;
  else if(pref==='window') score += role.window ? 0 : 1000;
  else if(pref==='front') score += seat.no;
  else if(pref==='rear') score += (1000-seat.no);
  score += sameGroupDistanceScore(seat,m,t);
  return score;
}
function autoFillOrder(a,b){
  const pr={aisle:0,window:0,front:1,rear:1,'':2};
  const pa=pr[validSeatPref(a.seatPref)]??2, pb=pr[validSeatPref(b.seatPref)]??2;
  if(pa!==pb) return pa-pb;
  const ga=validGroup(a.group), gb=validGroup(b.group);
  if(ga!==gb) return (ga||'zz').localeCompare(gb||'zz');
  return String(a.name||'').localeCompare(String(b.name||''),'zh-Hant');
}
function openAutoFillSeats(){
  const t=trip();
  const seated=new Set(Object.values(t.assign||{}));
  const people=activeMembers().filter(m=>!seated.has(m.id)&&!isLeave(m.id));
  const free=seatsOf(t.layoutV).filter(s=>!t.assign[s.id]);
  if(!editable()){ toast('舊行程不能自動排座'); return; }
  if(!people.length){ toast('沒有可自動安排的人'); return; }
  if(!free.length){ toast('沒有空位'); return; }
  openActs('自動填滿剩餘空位',
    '會把尚未排座位、且沒有請假的山友，自動安排到剩餘空位。<br><b>已經手動排好的座位不會被移動。</b><br>系統會依座位偏好優先安排：走道、靠窗、前排、後排；同群組會盡量靠近。',
    [{t:'開始自動填滿 '+Math.min(people.length,free.length)+' 人', cls:'primary', fn:()=>autoFillSeats()}]);
}
function autoFillSeats(){
  const t=trip(); if(!editable()) return;
  const seated=new Set(Object.values(t.assign||{}));
  const people=activeMembers().filter(m=>!seated.has(m.id)&&!isLeave(m.id)).sort(autoFillOrder);
  const free=seatsOf(t.layoutV).filter(s=>!t.assign[s.id]);
  if(!people.length || !free.length){ closeSheet(); toast('沒有可自動安排的人或空位'); return; }
  saveUndo('自動填滿');
  let assigned=0; const counts={aisle:0,window:0,front:0,rear:0,'':0};
  while(people.length && free.length){
    const m=people.shift();
    free.sort((a,b)=>autoSeatScore(a,m,t)-autoSeatScore(b,m,t) || a.no-b.no);
    const seat=free.shift();
    t.assign[seat.id]=m.id;
    counts[validSeatPref(m.seatPref)]++;
    assigned++;
  }
  pending=null; t.boarded=[]; closeSheet(); touch(); renderAll();
  const detail=[];
  if(counts.aisle) detail.push('走道 '+counts.aisle);
  if(counts.window) detail.push('靠窗 '+counts.window);
  if(counts.front) detail.push('前排 '+counts.front);
  if(counts.rear) detail.push('後排 '+counts.rear);
  if(counts['']) detail.push('無偏好 '+counts['']);
  toast('已自動安排 '+assigned+' 人'+(detail.length?'：'+detail.join('、'):''));
}


/* ══════════════════ 手機版名單總覽 ══════════════════ */
let rosterGridFilter='';
function defaultRosterGridFilter(){
  if(mode==='seat') return 'unassigned';
  if(mode==='rc' && trip().rcActive) return 'missing';
  return 'all';
}
function seatInfoByMember(mid){
  const sid=seatOf(mid);
  if(!sid) return null;
  return seatsOf(trip().layoutV).find(s=>s.id===sid) || null;
}
function memberGridState(m){
  const t=trip();
  const sid=seatOf(m.id);
  const seat=sid ? seatsOf(t.layoutV).find(s=>s.id===sid) : null;
  const leave=isLeave(m.id);
  const boarded=sid && (t.boarded||[]).includes(sid);
  const missing=(mode==='rc' && t.rcActive && sid && !leave && !boarded);
  return {sid, seat, leave, boarded, missing, assigned:!!sid};
}
function rosterGridTabs(){
  const tabs=[
    ['all','全部'],['unassigned','未排'],['assigned','已排'],['present','出席'],['leave','請假']
  ];
  if(mode==='rc' && trip().rcActive) tabs.push(['missing','未到']);
  return tabs.map(([id,name])=>'<button class="grid-tab '+(rosterGridFilter===id?'on':'')+'" onclick="openRosterGrid(\''+id+'\')">'+name+'</button>').join('');
}
function rosterGridMembers(){
  const list=activeMembers().slice().sort((a,b)=>{
    const sa=memberGridState(a), sb=memberGridState(b);
    const na=sa.seat?sa.seat.no:999, nb=sb.seat?sb.seat.no:999;
    if(rosterGridFilter==='assigned' || rosterGridFilter==='missing') return na-nb;
    if(na!==nb && (sa.assigned||sb.assigned)) return na-nb;
    return String(a.name||'').localeCompare(String(b.name||''),'zh-Hant');
  });
  return list.filter(m=>{
    const st=memberGridState(m);
    if(rosterGridFilter==='unassigned') return !st.assigned;
    if(rosterGridFilter==='assigned') return st.assigned;
    if(rosterGridFilter==='present') return !st.leave;
    if(rosterGridFilter==='leave') return st.leave;
    if(rosterGridFilter==='missing') return st.missing;
    return true;
  });
}
function rosterGridSummary(){
  const active=activeMembers();
  const seated=new Set(Object.values(trip().assign||{}));
  const un=active.filter(m=>!seated.has(m.id)).length;
  const leaveN=active.filter(m=>isLeave(m.id)).length;
  const assignedN=active.length-un;
  let s='共 '+active.length+' 人｜已排 '+assignedN+'｜未排 '+un+'｜請假 '+leaveN;
  if(mode==='rc' && trip().rcActive) s+='｜未到 '+rcMissing(trip()).length;
  return s;
}
function rosterGridCard(m){
  const st=memberGridState(m);
  const cls=['member-card'];
  if(st.leave) cls.push('leave');
  else if(st.missing) cls.push('missing');
  else if(st.boarded) cls.push('boarded');
  else if(st.assigned) cls.push('assigned');
  else cls.push('unassigned');
  const gc=groupClassName(m); if(gc) cls.push(gc);
  const meta=[];
  if(st.seat) meta.push(st.seat.no+' 號'); else meta.push('未排');
  if(st.leave) meta.push('請假');
  else if(mode==='rc' && trip().rcActive) meta.push(st.boarded?'已到':'未到');
  else meta.push('出席');
  const gp=groupLabel(m); if(gp) meta.push(gp);
  const sp=validSeatPref(m.seatPref); if(sp) meta.push('偏好：'+seatPrefName(sp));
  const badges='<span class="badges">'+(hasMemberNote(m)?'<span class="pill note">備</span>':'')+(telHref(m.phone)?'<span class="pill phone">☎</span>':'')+(lineHref(m.lineUrl)?'<span class="pill phone">LINE</span>':'')+'</span>';
  return '<button class="'+cls.join(' ')+'" onclick="tapRosterGridMember(\''+m.id+'\')">'+badges+'<span class="name">'+esc(m.name)+'</span><span class="meta">'+esc(meta.join('・'))+'</span></button>';
}
function openRosterGrid(filter){
  rosterGridFilter=filter || rosterGridFilter || defaultRosterGridFilter();
  const members=rosterGridMembers();
  const title = mode==='seat' ? '排座位名單總覽' : mode==='att' ? '出席名單總覽' : '點名名單總覽';
  $('sheet').className='sheet roster-grid-sheet';
  $('sheet').innerHTML='<h2>'+title+'</h2><div class="note">手機版格狀檢視。點人會依目前頁面執行動作。</div><div class="grid-tabs">'+rosterGridTabs()+'</div><div class="grid-summary">'+esc(rosterGridSummary())+'</div><div class="member-grid">'+(members.map(rosterGridCard).join('') || '<div class="hint">這個篩選目前沒有人。</div>')+'</div><div class="acts"><button class="act cancel" onclick="closeSheet()">關閉</button></div>';
  $('overlay').classList.add('show');
}
function tapRosterGridMember(mid){
  const m=memberById(mid); if(!m) return;
  const st=memberGridState(m);
  if(!editable()){
    if(st.seat) openContactActions(st.seat, mid, true);
    return;
  }
  if(mode==='seat'){
    if(!st.assigned){ pending={kind:'assign',memberId:mid}; closeSheet(); renderAll(); toast('請點「'+m.name+'」要坐的座位'); }
    else openContactActions(st.seat, mid, false);
    return;
  }
  if(mode==='att'){
    toggleLeaveMember(mid);
    openRosterGrid(rosterGridFilter);
    return;
  }
  if(mode==='rc'){
    const t=trip();
    if(t.rcActive && st.sid && !st.leave){
      const i=t.boarded.indexOf(st.sid);
      if(i>=0) t.boarded.splice(i,1); else t.boarded.push(st.sid);
      touch(); renderAll(); openRosterGrid(rosterGridFilter);
    }else if(st.seat){
      openContactActions(st.seat, mid, false);
    }else{
      toast('這位尚未排座位');
    }
  }
}

/* ══════════════════ 彈出視窗 ══════════════════ */
function sheetHTML(html){
  $('sheet').innerHTML=html;
  $('overlay').classList.add('show');
}
function closeSheet(){ $('overlay').classList.remove('show'); $('sheet').className='sheet'; }
let _acts=[];
function contactNote(m){
  if(!m) return '（資料已移除）';
  const phone = cleanPhone(m.phone);
  const line = cleanLineUrl(m.lineUrl);
  const note = String(m.note||'').trim();
  const gl = groupLabel(m);
  let html = phone ? '電話：<b>'+esc(phone)+'</b>' : '<b>尚未填電話</b>';
  html += line ? '<br>LINE：<b>'+esc(line)+'</b>' : '<br><b>尚未填 LINE</b>';
  if(gl) html += '<br>群組：<b>'+esc(gl)+'</b>';
  const sp=validSeatPref(m.seatPref);
  if(sp) html += '<br>座位偏好：<b>'+esc(seatPrefName(sp))+'</b>';
  if(note) html += '<br>備註：<b>'+esc(note)+'</b>';
  return html;
}
function openContactActions(seat, mid, readonly){
  const m=memberById(mid);
  const acts=[];
  if(m && telHref(m.phone)){
    acts.push({t:'撥打電話：'+cleanPhone(m.phone), cls:'primary', fn:()=>callMember(mid)});
  }else{
    acts.push({t:'尚未填電話（點此補電話）', fn:()=>{ if(m) openPhoneEditor(mid); }});
  }
  if(m && lineHref(m.lineUrl)){
    acts.push({t:'開啟 LINE', cls:'primary', fn:()=>openLine(mid)});
  }else{
    acts.push({t:'尚未填 LINE（點此補 LINE）', fn:()=>{ if(m) openLineEditor(mid); }});
  }
  if(!readonly && m){
    acts.push({t:'編輯旅客資料', fn:()=>editMember(m.id)});
  }
  openActs((seat?seat.no+' 號・':'')+(m?m.name:'（已移除）'), contactNote(m), acts);
}
function openContactActionsBySeat(sid){
  const t=trip();
  const mid=t.assign[sid];
  const seat=seatsOf(t.layoutV).find(s=>s.id===sid);
  if(mid) openContactActions(seat, mid, !editable());
}
function openActs(title, note, acts){
  _acts=acts;
  sheetHTML('<h2>'+esc(title)+'</h2><div class="note">'+note+'</div>'+
    '<div class="acts">'+acts.map((a,i)=>'<button class="act '+(a.cls||'')+'" onclick="_acts['+i+'].fn()">'+esc(a.t)+'</button>').join('')+
    '<button class="act cancel" onclick="closeSheet()">取消</button></div>');

function openVersionInfo(){

function deleteMemberHard(mid){
  const m=memberById(mid); if(!m) return;
  DB.members=DB.members.filter(x=>x.id!==mid);
  (DB.trips||[]).forEach(t=>{
    Object.keys(t.assign||{}).forEach(sid=>{ if(t.assign[sid]===mid) delete t.assign[sid]; });
    t.leave=(t.leave||[]).filter(x=>x!==mid);
    const validSeats=new Set(Object.keys(t.assign||{}));
    t.boarded=(t.boarded||[]).filter(sid=>validSeats.has(sid));
    t.updatedAt=nowTs();
  });
  pending=null;
  touchMembers(); closeSheet(); renderAll(); toast('已刪除 '+m.name);
}

/* CSV 名冊匯入／匯出 */
function csvEscape(v){
  const s=String(v??'');
  return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadTextFile(filename, text, type){
  const blob=new Blob([text],{type:type||'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename; a.click();
}
function memberCsvRows(includeData){
  const headers=['ID','姓名','電話','LINE連結','群組','座位偏好','備註','停用'];
  const rows=[headers];
  if(includeData){
    DB.members.forEach(m=>rows.push([m.id,m.name||'',m.phone||'',m.lineUrl||'',validGroup(m.group),seatPrefCsv(m.seatPref),m.note||'',m.inactive?'是':'']));
  }
  return '\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
}
function exportMembersCsv(){
  const d=new Date();
  const fn='山友名冊-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.csv';
  downloadTextFile(fn, memberCsvRows(true), 'text/csv;charset=utf-8');
  toast('已匯出名冊 CSV');
}
function downloadMemberCsvTemplate(){
  downloadTextFile('山友名冊空白範本.csv', memberCsvRows(false), 'text/csv;charset=utf-8');
}
function parseCsv(text){
  text=String(text||'').replace(/^\ufeff/,'');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], nx=text[i+1];
    if(q){
      if(ch==='"' && nx==='"'){ cell+='"'; i++; }
      else if(ch==='"'){ q=false; }
      else cell+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===','){ row.push(cell); cell=''; }
      else if(ch==='\n'){
        row.push(cell); rows.push(row); row=[]; cell='';
      }else if(ch==='\r'){
        if(nx==='\n') continue;
        row.push(cell); rows.push(row); row=[]; cell='';
      }else cell+=ch;
    }
  }
  row.push(cell); rows.push(row);
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function openMembersCsvImport(){
  sheetHTML('<h2>匯入名冊 CSV</h2>'+ 
    '<div class="note">先下載空白範本，或匯出現有名冊後在電腦修改。欄位為：ID、姓名、電話、LINE連結、群組、座位偏好、備註、停用。<br><b>ID 請不要改</b>，這樣匯入後原本座位安排會保留。群組可填 1～10，或填你已命名的群組名稱；座位偏好可填「走道優先、靠窗優先、前排優先、後排優先、無偏好」；停用可填「是」。</div>'+ 
    '<div class="acts" style="margin-bottom:12px"><button class="act" onclick="downloadMemberCsvTemplate()">下載空白範本</button></div>'+ 
    '<div class="field"><input type="file" id="memberCsvFile" accept=".csv,text/csv"></div>'+ 
    '<div class="acts">'+ 
      '<button class="act primary" onclick="doMemberCsvImport()">匯入 CSV（合併更新）</button>'+ 
      '<button class="act cancel" onclick="openMembers()">返回名冊管理</button>'+ 
    '</div>');
}
function csvBool(v){
  const s=String(v||'').trim().toLowerCase();
  return ['1','true','yes','y','是','停用','停用中','inactive'].includes(s);
}
function doMemberCsvImport(){
  const f=$('memberCsvFile').files[0];
  if(!f){ toast('請先選擇 CSV 檔'); return; }
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const rows=parseCsv(rd.result);
      if(rows.length<2) throw new Error('empty');
      const headers=rows[0].map(h=>String(h||'').trim());
      const idx=name=>headers.findIndex(h=>h===name || h.toLowerCase()===name.toLowerCase());
      const iId=idx('ID'), iName=idx('姓名'), iPhone=idx('電話'), iLine=idx('LINE連結'), iGroup=idx('群組'), iPref=idx('座位偏好'), iNote=idx('備註'), iInactive=idx('停用');
      if(iName<0) throw new Error('no name');
      let added=0, updated=0, skipped=0;
      rows.slice(1).forEach(r=>{
        const name=String(r[iName]||'').trim();
        if(!name){ skipped++; return; }
        const id=iId>=0?String(r[iId]||'').trim():'';
        let m = id ? DB.members.find(x=>x.id===id) : null;
        if(!m) m = DB.members.find(x=>x.name===name);
        if(!m){ m={id:id||newId('m'), name:'', phone:'', group:'', seatPref:'', note:'', inactive:false}; DB.members.push(m); added++; }
        else updated++;
        m.name=name;
        if(iPhone>=0) m.phone=cleanPhone(r[iPhone]);
        if(iLine>=0) m.lineUrl=cleanLineUrl(r[iLine]);
        if(iGroup>=0) m.group=validGroup(r[iGroup]);
        if(iPref>=0) m.seatPref=validSeatPref(r[iPref]);
        if(iNote>=0) m.note=String(r[iNote]||'').trim();
        if(iInactive>=0) m.inactive=csvBool(r[iInactive]);
      });
      touchMembers(); closeSheet(); renderAll(); openMembers();
      toast('匯入完成：新增 '+added+'、更新 '+updated+(skipped?'、略過 '+skipped:''));
    }catch(e){
      toast('CSV 格式不正確，至少要有「姓名」欄');
    }
  };
  rd.readAsText(f,'utf-8');
}

  return {'apikey':SYNC.key,'Authorization':'Bearer '+SYNC.key,'Content-Type':'application/json'};
}
async function pull(showResult){
  if(!syncReady() || _pulling) return;
  _pulling=true;
  syncUI('busy','同步中…');
  try{
    const r=await fetch(SYNC.url+'/rest/v1/bus_state?id=eq.'+encodeURIComponent(SYNC.token)+'&select=data',
      {headers:sbHeaders()});
    if(!r.ok) throw new Error(r.status);
    const rows=await r.json();
    if(rows.length) mergeRemote(rows[0].data);
    await push(); /* 合併後把最新結果送回雲端 */
    persist();
    if(!viewId || !DB.trips.find(t=>t.id===viewId)) viewId=latestTrip().id;
    renderAll();
    syncUI('ok','已同步 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
    if(showResult) toast('同步成功');
  }catch(e){
    syncUI(navigator.onLine?'err':'','網路'+(navigator.onLine?'同步失敗':'離線，資料存在本機'));
    if(showResult) toast('連不上雲端，請檢查設定或網路');
  }
  _pulling=false;
}
async function push(){
  if(!syncReady()) return;
  const body=JSON.stringify([{id:SYNC.token, data:DB, updated_at:new Date().toISOString()}]);
  const r=await fetch(SYNC.url+'/rest/v1/bus_state',
    {method:'POST', headers:{...sbHeaders(),'Prefer':'resolution=merge-duplicates'}, body});
  if(!r.ok) throw new Error(r.status);
}
function schedulePush(){
  if(!syncReady()) return;
  clearTimeout(_pushTimer);
  syncUI('busy','同步中…');
  _pushTimer=setTimeout(async ()=>{
    try{
      await push();
      syncUI('ok','已同步 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
    }catch(e){
      syncUI(navigator.onLine?'err':'', navigator.onLine?'同步失敗':'離線，資料存在本機');
    }
  },1500);
}
function mergeRemote(r){
  if(!r) return;
  if((r.membersUpdatedAt||0) > (DB.membersUpdatedAt||0)){
    DB.members=(r.members||[]).map(normalizeMember); DB.groupNames={...defaultGroupNames(), ...(r.groupNames||{})}; DB.membersUpdatedAt=r.membersUpdatedAt||0;
  }
  (r.trips||[]).forEach(rt=>{
    const lt=DB.trips.find(t=>t.id===rt.id);
    if(!lt) DB.trips.push(rt);
    else if((rt.updatedAt||0)>(lt.updatedAt||0)) Object.assign(lt, rt);
  });
}
/* 回到 App、恢復連線、定時：都拉一次 */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pull(); });
window.addEventListener('online',()=>pull());
window.addEventListener('offline',()=>syncUI('','離線，資料存在本機'));
setInterval(()=>{ if(!document.hidden) pull(); }, 45000);

/* ══════════════════ 傳到 LINE ══════════════════ */
async function shareChart(){
  const t=trip();
  const L=LAYOUTS[t.layoutV]||LAYOUTS[DEFAULT_LAYOUT];
  const seats=seatsOf(t.layoutV);
  const SW=88, SH=52, GAP=8, AISLE=56, PAD=36, HEAD=110;
  function colH(side){
    let h=0;
    L[side].forEach(b=>{ h += b.type==='seats' ? b.rows*(SH+GAP) : (b.grow?0:40+GAP); });
    return h;
  }
  const leftH=Math.max(colH('left'), colH('right'));
  const W=PAD*2+SW*4+GAP*2+AISLE, H=HEAD+leftH+PAD+30;
  const cv=document.createElement('canvas');
  const scale=2; cv.width=W*scale; cv.height=H*scale;
  const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
  ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#26323F'; ctx.textAlign='center';
  ctx.font='700 24px "PingFang TC",sans-serif';
  ctx.fillText(t.name+'　座位表', W/2, 40);
  const leaveN=t.leave.length;
  const goN=Object.values(t.assign).filter(mid=>!t.leave.includes(mid)).length;
  ctx.font='400 16px "PingFang TC",sans-serif'; ctx.fillStyle='#7A8683';
  ctx.fillText((t.dateText?t.dateText+'　':'')+'出席 '+goN+' 人・請假 '+leaveN+' 人　↑ 車頭', W/2, 68);

  function roundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
    c.fill(); c.stroke();
  }
  function drawCol(side, x0){
    let y=HEAD;
    const diff=leftH-colH(side);
    L[side].forEach(b=>{
      if(b.type==='gap'){
        const gh=b.grow?diff:40;
        ctx.fillStyle='#ADB6B1'; ctx.font='400 13px "PingFang TC",sans-serif'; ctx.textAlign='center';
        ctx.fillText(b.label, x0+SW+GAP/2, y+gh/2+4);
        y+=gh+GAP;
      }else{
        for(let r=0;r<b.rows;r++){
          for(let c=0;c<2;c++){
            const seat=seats.find(s=>s.zone===b.zone&&s.row===r&&s.col===c);
            const x=x0+c*(SW+GAP);
            const mid=t.assign[seat.id];
            const onLeave=mid&&t.leave.includes(mid);
            const gm=mid?memberById(mid):null;
            const gi=gm?groupInfo(gm.group):null;
            ctx.fillStyle=onLeave?'#E3E5E2':(gi?gi.fill:(mid?'#F4F8F5':'#FFFFFF'));
            ctx.strokeStyle=gi?gi.color:(mid?'#9DB3A6':'#C7CEC9'); ctx.lineWidth=gi?2.3:1.5;
            roundRect(ctx,x,y,SW,SH,8);
            if(gi){
              ctx.fillStyle=gi.color; ctx.fillRect(x+1,y+SH-6,SW-2,5);
              ctx.fillStyle='#FFFFFF'; ctx.font='700 10px sans-serif'; ctx.textAlign='left';
              ctx.fillText(gi.id, x+7, y+SH-10);
            }
            ctx.fillStyle='#ADB6B1'; ctx.font='400 10px sans-serif'; ctx.textAlign='left';
            ctx.fillText(seat.no, x+5, y+13);
            ctx.textAlign='center';
            if(mid){
              const m=memberById(mid);
              ctx.fillStyle=onLeave?'#98A09B':'#26323F';
              ctx.font='700 16px "PingFang TC",sans-serif';
              ctx.fillText(m?m.name:'？', x+SW/2, y+SH/2+6);
              if(onLeave){ ctx.font='400 11px sans-serif'; ctx.fillText('請假', x+SW/2, y+SH-6); }
            }
          }
          y+=SH+GAP;
        }
      }
    });
  }
  drawCol('left', PAD);
  drawCol('right', PAD+SW*2+GAP+AISLE);

  cv.toBlob(async blob=>{
    const file=new File([blob],'座位表.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'座位表'}); }catch(e){}
    }else{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='座位表.png'; a.click();
      toast('已下載座位表圖片');
    }
  },'image/png');
}

/* ══════════════════ 啟動 ══════════════════ */
load();
viewId=latestTrip().id;
renderAll();
if(syncReady()) pull(); else syncUI('','尚未設定同步');
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
